<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель управления</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #0d1117; color: #c9d1d9; display: flex; height: 100vh; }
        
        /* Боковая панель */
        .sidebar { width: 220px; background: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; padding: 20px; }
        .sidebar h2 { font-size: 18px; color: #f0f6fc; margin-bottom: 20px; }
        .menu-btn { background: transparent; border: 1px solid #30363d; color: #c9d1d9; padding: 10px; margin: 5px 0; border-radius: 6px; cursor: pointer; text-align: left; }
        .menu-btn:hover { background: #30363d; }
        
        /* Основной контент */
        .main { flex: 1; padding: 40px; }
        .user-card { background: #161b22; padding: 20px; border: 1px solid #30363d; border-radius: 6px; width: fit-content; }
        .btn-logout { background: #da3633; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="sidebar" id="sidebar" style="display:none;">
    <h2>Меню</h2>
    <button class="menu-btn">Главная</button>
    <button class="menu-btn">Профиль</button>
    <button class="menu-btn">Настройки</button>
</div>

<div class="main">
    <div id="login-screen">
        <h2>Войти в систему</h2>
        <button id="google-btn" style="padding: 10px; cursor: pointer;">Войти через Google</button>
    </div>

    <div id="dashboard" class="user-card" style="display:none;">
        <h3 id="username"></h3>
        <p id="user-email"></p>
        <button class="btn-logout" id="logout-btn">Выйти</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBI0_cJasOJZYKtycOlhLuwwSc2h5buznc",
        authDomain: "my-sait-c7862.firebaseapp.com",
        projectId: "my-sait-c7862",
        storageBucket: "my-sait-c7862.firebasestorage.app",
        messagingSenderId: "921533837162",
        appId: "1:921533837162:web:b642c0692f8401e8bb3f13"
    };

    initializeApp(firebaseConfig);
    const auth = getAuth();
    const provider = new GoogleAuthProvider();

    document.getElementById('google-btn').onclick = () => signInWithPopup(auth, provider);
    document.getElementById('logout-btn').onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('sidebar').style.display = 'flex';
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            
            // Берем имя из Google или часть почты, если имени нет
            document.getElementById('username').innerText = user.displayName || "Пользователь";
            document.getElementById('user-email').innerText = user.email;
        } else {
            document.getElementById('sidebar').style.display = 'none';
            document.getElementById('login-screen').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
        }
    });
</script>
</body>
</html>
