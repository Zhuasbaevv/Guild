<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { width: 340px; padding: 20px; border: 1px solid #30363d; border-radius: 6px; background: #161b22; }
        h2 { text-align: center; color: #f0f6fc; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #30363d; border-radius: 6px; background: #0d1117; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        .btn-green { background: #238636; color: white; }
        .btn-white { background: #f0f6fc; color: #161b22; }
    </style>
</head>
<body>

<div class="box">
    <div id="auth-form">
        <h2>Войти в систему</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Пароль">
        <button class="btn-green" id="login-btn">Войти</button>
        <button class="btn-white" id="google-btn">Продолжить с Google</button>
    </div>
    <div id="user-profile" style="display:none;">
        <h2 id="welcome-text"></h2>
        <button class="btn-green" id="logout-btn">Выйти</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBI0_cJasOJZYKtycOlhLuwwSc2h5buznc",
        authDomain: "my-sait-c7862.firebaseapp.com",
        projectId: "my-sait-c7862",
        storageBucket: "my-sait-c7862.firebasestorage.app",
        messagingSenderId: "921533837162",
        appId: "1:921533837162:web:b642c0692f8401e8bb3f13"
    };

    initializeApp(firebaseConfig);
    const auth = getAuth();
    const provider = new GoogleAuthProvider();

    document.getElementById('google-btn').onclick = () => {
        signInWithPopup(auth, provider).catch(err => alert("Ошибка Firebase: " + err.message));
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('auth-form').style.display = 'none';
            document.getElementById('user-profile').style.display = 'block';
            document.getElementById('welcome-text').innerText = "Привет, " + user.email;
        } else {
            document.getElementById('auth-form').style.display = 'block';
            document.getElementById('user-profile').style.display = 'none';
        }
    });

    document.getElementById('logout-btn').onclick = () => signOut(auth);
</script>
</body>
</html>
