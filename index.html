<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #0d1117; color: #c9d1d9; display: flex; height: 100vh; }
        .sidebar { width: 60px; background: #161b22; border-right: 1px solid #30363d; display: none; flex-direction: column; align-items: center; padding-top: 20px; }
        .main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
        
        input { width: 100%; max-width: 300px; padding: 12px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: white; }
        button { width: 100%; max-width: 300px; padding: 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; background: #238636; color: white; }
        
        #reg-screen { display: none; }
    </style>
</head>
<body>

<div class="sidebar" id="sidebar">
    <div style="font-size: 24px; cursor: pointer;">≡</div>
</div>

<div class="main">
    <div id="login-screen">
        <h2>Вход</h2>
        <button id="google-btn">Продолжить с Google</button>
    </div>

    <div id="reg-screen">
        <h2>Введите ваш NickName</h2>
        <input type="text" id="nick-input" placeholder="Ваш никнейм">
        <button id="save-nick-btn">Сохранить</button>
    </div>

    <div id="content" style="display:none;">
        <h2 id="welcome-msg"></h2>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBI0_cJasOJZYKtycOlhLuwwSc2h5buznc",
        authDomain: "my-sait-c7862.firebaseapp.com",
        projectId: "my-sait-c7862",
        storageBucket: "my-sait-c7862.firebasestorage.app",
        messagingSenderId: "921533837162",
        appId: "1:921533837162:web:b642c0692f8401e8bb3f13"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    document.getElementById('google-btn').onclick = () => signInWithPopup(auth, provider);

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const userRef = doc(db, "users", user.uid);
            const snap = await getDoc(userRef);

            if (!snap.exists()) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('reg-screen').style.display = 'block';
                document.getElementById('save-nick-btn').onclick = async () => {
                    const nick = document.getElementById('nick-input').value;
                    await setDoc(userRef, { nickname: nick });
                    location.reload();
                };
            } else {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('reg-screen').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                document.getElementById('sidebar').style.display = 'flex';
                document.getElementById('welcome-msg').innerText = "Привет, " + snap.data().nickname;
            }
        }
    });
</script>
</body>
</html>
